# ---------------------------------------------------------------------------
# AI-Powered Ingredient Detection and Recipe Generation - back-end configuration
# ---------------------------------------------------------------------------

# Server port. Render sets $PORT itself in production; this default is only used locally.
server.port=${PORT:8080}

# --- Third-party API keys ---------------------------------------------------
# Leave these blank to run in mock mode (see README.md). Once you have real keys, either
# fill them in here for local testing, or (recommended, especially for deployment) set the
# CLARIFAI_API_KEY / SPOONACULAR_API_KEY environment variables on Render so the real keys
# are never committed to GitHub.
clarifai.api.key=${CLARIFAI_API_KEY:}
spoonacular.api.key=${SPOONACULAR_API_KEY:}

# Minimum Clarifai confidence (0.0-1.0) for a detected concept to be treated as an ingredient.
clarifai.confidence.threshold=${CLARIFAI_CONFIDENCE_THRESHOLD:0.70}

# --- CORS / cross-origin session cookie -------------------------------------
# Comma-separated list of front-end origins allowed to call this API with credentials.
# Add your deployed Render Static Site URL here (as an env var in production), e.g.:
#   APP_CORS_ALLOWED_ORIGINS=https://ingredient-app-frontend.onrender.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Required for the session cookie to survive a cross-origin fetch() call in modern browsers.
server.servlet.session.cookie.same-site=none
# SameSite=None cookies must also be Secure, but Secure cookies won't round-trip over plain
# http:// during local testing (e.g. with curl, or a browser on http://localhost). Defaults to
# false for local dev; set SESSION_COOKIE_SECURE=true as an environment variable on Render,
# where everything is served over HTTPS, so real cross-origin browser sessions work correctly.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
