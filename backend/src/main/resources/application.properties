# Server port - Render sets this itself, default is just for running locally
server.port=${PORT:8080}

# --- API keys ---------------------------------------------------------------
# Leave blank to run in mock mode. Set these as env vars on Render instead of
# putting real keys in this file.
gemini.api.key=${GEMINI_API_KEY:}
spoonacular.api.key=${SPOONACULAR_API_KEY:}

# Gemini model to use
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# minimum confidence (0-1) for a detected ingredient to be kept
gemini.confidence.threshold=${GEMINI_CONFIDENCE_THRESHOLD:0.70}

# --- CORS / session cookie ---------------------------------------------------
# front-end origin(s) allowed to call this API, comma-separated. Set the real
# deployed front-end URL as an env var on Render, e.g.:
#   APP_CORS_ALLOWED_ORIGINS=https://smartchef-app-ujf2.onrender.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# needed so the session cookie still works cross-origin
server.servlet.session.cookie.same-site=none
# SameSite=None cookies need Secure too, but that breaks plain http:// on localhost,
# so default off locally and set SESSION_COOKIE_SECURE=true on Render (it's all https there).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
